spring.application.name=CloudAPIGateway

#  Gateway Port number 
server.port=9090

#Eureka url
eureka.client.service-url.default-zone=http://localhost:8761/eureka

# activate all actuators
management.endpoints.web.exposure.include=*

#Write  API Gateway  Route and  Predicate  info
spring.cloud.gateway.routes[0].id=EMPLOYEE-SERVICE
spring.cloud.gateway.routes[0].uri=lb://EMPLOYEE-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/employee-api/**

spring.cloud.gateway.routes[1].id=CUSTOMER-SERVICE
spring.cloud.gateway.routes[1].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/customer-api/**

## Logging  configurations
logging.level.com.nt=DEBUG
#logging.file.name=d:/apigateway_log3.txt





